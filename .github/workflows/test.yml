name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

# The test suite expects a POSIX like environment (for example $HOME). On
# Windows the default shell is PowerShell, where $HOME isn't set.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install the package and the test requirements
        run: uv pip install . --requirement=requirements-tests.txt --requirement=requirements-checks.txt

      # Three tests read the system log, which only root and the adm group may read.
      - name: Make the system log readable
        if: runner.os == 'Linux'
        run: sudo chmod a+r /var/log/syslog || true

      - name: Check coding style
        run: flake8

      # The outcome is repeated as annotations so that failed and skipped
      # tests are visible on the summary page, without opening the log.
      - name: Run the test suite
        run: |
          set +e
          python -m pytest --timeout=120 -rfEs --color=no | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | head -n 8 | sed 's/^/::error title=pytest::/'
          grep -E '^SKIPPED ' pytest.log | sed -E 's/^SKIPPED \[[0-9]+\] [^:]+:[0-9]+: //' | sort | uniq -c \
            | head -n 8 | sed 's/^ */::notice title=skipped::/'
          echo "::notice title=pytest::$(tail -n 1 pytest.log)"
          exit "$status"

  package:
    name: Build the distribution archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Build the source distribution and the wheel
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  installed:
    name: Check the installed wheel on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true

      # The wheel depends on humanfriendly-ng, the requirements file says where to get it.
      - name: Install the wheel
        shell: bash
        run: uv pip install dist/*.whl --requirement=requirements-tests.txt

      - name: Check the path configuration file and the command line interface
        shell: bash
        run: |
          script="$PWD/scripts/check-installed-pth.py"
          cd "$RUNNER_TEMP"
          python "$script"
          coloredlogs --help
          python -W error -c "import coloredlogs, coloredlogs.cli, coloredlogs.converter, coloredlogs.syslog"
